on: push
name: Build and deploy GH Pages
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: install latest zola 0.23.x
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/getzola/zola/releases?per_page=100" \
            | jq -r '.[].tag_name' \
            | grep -E '^v0\.23\.[0-9]+$' \
            | sort -V \
            | tail -n1)
          echo "Installing Zola $version"
          curl -fsSL "https://github.com/getzola/zola/releases/download/$version/zola-$version-x86_64-unknown-linux-gnu.tar.gz" \
            | sudo tar xzf - -C /usr/local/bin zola
          zola --version
      - name: build
        run: zola build
      - name: deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
