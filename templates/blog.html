{% extends "index.html" %}

{%- block title -%}
    {{<site.title page_title={section.title} />}}
{%- endblock -%}

{% block content %}
    <div class="post">
        <h1 class="post-title">{{ section.title }}</h1>
        {{<post.list_posts pages={section.pages} />}}
        {{<post.content page={section} summary={false} show_only_description={false} />}}
    </div>
{% endblock content %}
