{% component row2(src1, src2, alt1 = "", alt2 = "") %}
<div style="display: flex; gap: 20px; justify-content: center; align-items: center; margin-bottom: 20px;">
  <img src="{{ src1 }}" alt="{{ alt1 }}" style="width: 45%; border-radius: 8px;" loading="lazy">
  <img src="{{ src2 }}" alt="{{ alt2 }}" style="width: 45%; border-radius: 8px;" loading="lazy">
</div>
{% endcomponent row2 %}
